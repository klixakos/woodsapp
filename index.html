<style>
  :root{
    --ink:#212327; --bg:#F2F2F0; --panel:#FFFFFF; --border:#E1E1DF; --muted:#6C6E72;
    --accent:#4B4E54; --accent-dark:#34363B; --accent-soft:#E7E7E8;
    --warn:#A6503C; --warn-soft:#F3E2DC; --focus:#4B4E54;
    box-sizing:border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EDEDEC; --bg:#141516; --panel:#1D1E20; --border:#2C2D30; --muted:#9A9C9F;
      --accent:#8A8D93; --accent-dark:#6E7176; --accent-soft:#2A2B2E; --warn:#D08D78; --warn-soft:#3A2A24;
    }
  }
  :root[data-theme="dark"]{
    --ink:#EDEDEC; --bg:#141516; --panel:#1D1E20; --border:#2C2D30; --muted:#9A9C9F;
    --accent:#8A8D93; --accent-dark:#6E7176; --accent-soft:#2A2B2E; --warn:#D08D78; --warn-soft:#3A2A24;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.brand{font-family:'Space Grotesk',system-ui,sans-serif;}
  button{font-family:inherit;} input, select{font-family:inherit;} a{color:inherit;}

  .auth-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}

  function translateError(msg){
    var key = ERROR_KEY_MAP[msg];
    return key ? t(key) : msg;
  }

  var sbClient = null;
  try { sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e){}

  var root = document.getElementById("root");
  var CACHE = { me:null, profiles:[], slots:[], bookings:[], slotCounts:{} };

  var UI = {
    screen:"login", authError:"", loading:true, view:"calendar",
    calMonth:(function(){ var d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(),
    selectedDate: todayISO(), sidebarOpen:false, toast:null, busy:false,
    lang: localStorage.getItem("woods_lang") || (navigator.language && navigator.language.indexOf("el")===0 ? "el" : "en")
  };

  function todayISO(){ return isoDate(new Date()); }
  function isoDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function formatDate(d){ return d.toLocaleDateString(UI.lang==='el'?'el-GR':undefined,{month:'short',day:'numeric',year:'numeric'}); }
  function formatTime(tm){
    var parts=tm.split(":"); var h=parseInt(parts[0],10); var m=parts[1];
    if(UI.lang === 'el'){ return pad(h)+":"+m; }
    var ampm=h>=12?"PM":"AM"; var h12=h%12; if(h12===0)h12=12;
    return h12+":"+m+" "+ampm;
  }
  function showToast(msg){ UI.toast=msg; render(); setTimeout(function(){ UI.toast=null; render(); }, 3000); }
  function usernameToEmail(u){ return u.trim().toLowerCase()+EMAIL_DOMAIN; }
  function oneMonthFromNowISO(){ var d=new Date(); d.setMonth(d.getMonth()+1); return isoDate(d); }
  function tokenExpiryDate(profile){ return profile.tokens_expire_at ? new Date(profile.tokens_expire_at) : null; }

  async function safeRun(fn){
    try { await fn(); }
    catch(e){ showToast(t('toast_generic_error')); }
  }

  // ---------------- data layer ----------------
  async function refreshAll(){
    var sessionRes = await sbClient.auth.getSession();
    var session = sessionRes.data.session;
    if(!session){ CACHE.me=null; return; }

    await sbClient.rpc('expire_my_tokens');

    var profRes = await sbClient.from('profiles').select('*').eq('id', session.user.id).single();
    CACHE.me = profRes.data || null;
    if(!CACHE.me) return;
    var isAdmin = CACHE.me.role === 'admin';

    var slotsRes = await sbClient.from('slots').select('*').order('date').order('time');
    CACHE.slots = slotsRes.data || [];

    var bookingsRes = await sbClient.from('bookings').select('*');
    CACHE.bookings = bookingsRes.data || [];

    var countsRes = await sbClient.rpc('slot_booking_counts');
    CACHE.slotCounts = {};
    (countsRes.data || []).forEach(function(row){ CACHE.slotCounts[row.slot_id] = row.booked_count; });

    if(isAdmin){
      var profilesRes = await sbClient.from('profiles').select('*').eq('role','client');
      CACHE.profiles = profilesRes.data || [];
    }
  }

  // spots taken for a slot: admin sees exact identities; everyone uses the shared count RPC either way
  function bookedCountForSlot(slotId){
    if(CACHE.slotCounts[slotId] !== undefined) return CACHE.slotCounts[slotId];
    return CACHE.bookings.filter(function(b){ return b.slot_id===slotId && b.status==='booked'; }).length;
  }
  function myBookingForSlot(slotId, userId){
    return CACHE.bookings.find(function(b){ return b.slot_id===slotId && b.user_id===userId && b.status==='booked'; });
  }
  function slotsForDate(dateISO){
    return CACHE.slots.filter(function(s){ return s.date===dateISO; }).sort(function(a,b){ return a.time.localeCompare(b.time); });
  }

  // ---------------- render ----------------
  async function render(){
    if(!sbClient){
      root.innerHTML = '<div class="auth-wrap"><div class="auth-card"><h1 class="brand">Setup needed</h1><p class="auth-sub">Add your Supabase URL and anon key at the top of the script before this app will work.</p></div></div>';
      return;
    }
    if(UI.loading){ root.innerHTML = '<div class="center-loading">Loading…</div>'; return; }
    if(!CACHE.me){ root.innerHTML = UI.screen==="signup" ? renderSignup() : renderLogin(); }
    else { root.innerHTML = renderApp(CACHE.me); }
    if(UI.toast){ var el=document.createElement("div"); el.className="toast"; el.textContent=UI.toast; root.appendChild(el); }
    bindEvents();
  }

      '<button type="button" class="lang-btn'+(UI.lang==='el'?' active':'')+'" data-lang="el">ΕΛ</button>' +
      '</div>';
  }

  function buildCalendarGrid(monthDate, opts){
    var year=monthDate.getFullYear(), month=monthDate.getMonth();
    var first=new Date(year,month,1); var startWeekday=first.getDay();
    var daysInMonth=new Date(year,month+1,0).getDate();
    var monthLabel=monthDate.toLocaleDateString(UI.lang==='el'?'el-GR':undefined,{month:'long',year:'numeric'});
    var dowLabels = UI.lang==='el' ? ["Κ","Δ","Τ","Τ","Π","Π","Σ"] : ["S","M","T","W","T","F","S"];
    var cells=""; dowLabels.forEach(function(d){ cells+='<div class="cal-dow">'+d+'</div>'; });
    for(var i=0;i<startWeekday;i++){ cells+='<div class="cal-day empty"></div>'; }
    for(var day=1; day<=daysInMonth; day++){
      var dISO=year+"-"+pad(month+1)+"-"+pad(day);
      var isPast = dISO < (opts.minDateISO || todayISO());
      var marker = opts.getMarker ? opts.getMarker(dISO) : null;
      var classes="cal-day";
      if(isPast) classes+=" past";
      if(dISO===UI.selectedDate) classes+=" selected";
      if(marker==="full") classes+=" full";
      var dotHtml = marker ? '<div class="dot"></div>' : '';
      cells += '<div class="'+classes+'" data-date="'+(isPast?'':dISO)+'">'+day+dotHtml+'</div>';
    }
    return (
      '<div class="cal-box"><div class="cal-nav"><button data-cal="prev">&#8249;</button>' +
      '<div class="label">'+monthLabel+'</div><button data-cal="next">&#8250;</button></div>' +
      '<div class="cal-grid">'+cells+'</div></div>'
    );
  }

  function renderClientCalendar(user){
    var calHtml = buildCalendarGrid(UI.calMonth, { getMarker:function(dISO){
      var slots=slotsForDate(dISO); if(!slots.length) return null;
      var anyOpen = slots.some(function(s){ return bookedCountForSlot(s.id) < CAPACITY; });
      return anyOpen ? "has" : "full";
    }});
    var slots = slotsForDate(UI.selectedDate);
    var dateObj = new Date(UI.selectedDate+"T00:00:00");
    var rows;
    if(!slots.length){ rows='<div class="empty-note">'+t('no_sessions_day')+'</div>'; }
    else {
      rows = slots.map(function(s){
        var bookedCount = bookedCountForSlot(s.id);
        var spotsLeft = CAPACITY - bookedCount;
        var alreadyBooked = !!myBookingForSlot(s.id, user.id);
        var full = spotsLeft<=0; var noTokens = user.tokens<1;
        var btn;
        if(alreadyBooked) btn='<span class="badge badge-upcoming">'+t('badge_booked')+'</span>';
        else if(full) btn='<button class="btn btn-ghost btn-sm" disabled>'+t('btn_full')+'</button>';
        else if(noTokens) btn='<button class="btn btn-ghost btn-sm" disabled>'+t('btn_no_tokens')+'</button>';
        else btn='<button class="btn btn-primary btn-sm" data-book="'+s.id+'">'+t('btn_book')+'</button>';
        return '<div class="slot-row"><div><div class="slot-time">'+formatTime(s.time)+'</div>' +
          '<div class="slot-meta">'+t('spots_open')(spotsLeft, CAPACITY)+'</div></div>'+btn+'</div>';
      }).join("");
    }
    return (
      '<div class="page-head"><h1>'+t('book_title')+'</h1><p>'+t('book_sub')+'</p></div>' +
      '<div class="cal-layout">'+calHtml+
        '<div class="day-detail"><h3>'+dateObj.toLocaleDateString(UI.lang==='el'?'el-GR':undefined,{weekday:'long',month:'long',day:'numeric'})+'</h3>' +
        '<div class="sub">'+t('tokens_available')(user.tokens)+'</div>'+rows+'</div>' +
      '</div>'
    );
  }

  function renderMyAppointments(user){
    var now = Date.now();
    var mine = CACHE.bookings.filter(function(b){ return b.user_id===user.id && b.status==="booked"; }).map(function(b){
      var slot = CACHE.slots.find(function(s){ return s.id===b.slot_id; });
      return {booking:b, slot:slot};
    }).filter(function(x){ return x.slot && new Date(x.slot.date+"T"+x.slot.time).getTime() > now; })
      .sort(function(a,b){ return (a.slot.date+a.slot.time) < (b.slot.date+b.slot.time) ? -1 : 1; });

    var rows = mine.map(function(x){
      var b=x.booking, s=x.slot;
      var dt = new Date(s.date+"T"+s.time);
      var hoursUntil = (dt.getTime()-now)/3600000;
      var canCancel = hoursUntil>=CANCEL_WINDOW_HOURS;
      var badge = '<span class="badge badge-upcoming">'+t('badge_upcoming')+'</span>';
      var action = canCancel ? '<button class="btn btn-danger btn-sm" data-cancel="'+b.id+'">'+t('btn_cancel_refund')+'</button>'
        : '<button class="btn btn-ghost btn-sm" disabled title="'+t('tooltip_too_late')+'">'+t('btn_too_late')+'</button>';
      return '<div class="appt-card"><div><div class="appt-date">'+formatDate(dt)+'</div>' +
        '<div class="appt-when">'+formatTime(s.time)+'</div></div>' +
        '<div style="display:flex;align-items:center;gap:10px;">'+badge+action+'</div></div>';
    }).join("");

    return (
      '<div class="page-head"><h1>'+t('appts_title')+'</h1><p>'+t('appts_sub')(CANCEL_WINDOW_HOURS)+'</p></div>' +
      (rows || '<div class="empty-note">'+t('no_appts')+'</div>')
    );
  }

    var calHtml = buildCalendarGrid(UI.calMonth, {
      getMarker:function(dISO){
        var slots=slotsForDate(dISO); if(!slots.length) return null;

        return anyOpen ? "has" : "full";

    var slots = slotsForDate(UI.selectedDate);

          '<button class="btn btn-danger btn-sm" data-remove-slot="'+s.id+'">'+t('btn_remove')+'</button></div>';

      '<input id="new-slot-time" type="time" required></div><button type="submit" class="btn btn-primary">'+t('btn_add')+'</button></form>'
    );
    return (
      '<div class="page-head"><h1>'+t('manage_title')+'</h1><p>'+t('manage_sub')(CAPACITY)+'</p></div>' +
      '<div class="cal-layout">'+calHtml+
        '<div class="day-detail"><h3>'+dateObj.toLocaleDateString(UI.lang==='el'?'el-GR':undefined,{weekday:'long',month:'long',day:'numeric'})+'</h3>' +
        '<div class="sub">'+(isPastDay?t('past_date'):t('times_available'))+'</div>'+rows+addForm+'</div>' +
      '</div>'
    );

  function renderAllBookings(){
    var upcoming = CACHE.slots.filter(function(s){ return s.date>=todayISO() && bookedCountForSlot(s.id)>0; })
      .sort(function(a,b){ return (a.date+a.time) < (b.date+b.time) ? -1 : 1; });
    var rows = upcoming.map(function(s){
      var ids = CACHE.bookings.filter(function(b){ return b.slot_id===s.id && b.status==='booked'; }).map(function(b){ return b.user_id; });
      var names = ids.map(function(uidv){
        var u = CACHE.profiles.find(function(x){ return x.id===uidv; });
        return u ? (u.full_name || u.username) : (CACHE.me && CACHE.me.id===uidv ? (CACHE.me.full_name||CACHE.me.username) : "client");
      }).join(", ");
      var dt = new Date(s.date+"T"+s.time);
      return '<div class="appt-card"><div><div class="appt-date">'+formatDate(dt)+'</div>' +
        '<div class="appt-when">'+formatTime(s.time)+' &middot; '+t('booked_count')(ids.length, CAPACITY)+'</div>' +
        '<div class="appt-when">'+escapeHtml(names||"—")+'</div></div></div>';
    }).join("");
    return '<div class="page-head"><h1>'+t('allbookings_title')+'</h1><p>'+t('allbookings_sub')+'</p></div>' +
      (rows || '<div class="empty-note">'+t('no_upcoming')+'</div>');
  }

  // ---------------- events ----------------
  function bindEvents(){
    document.querySelectorAll("[data-lang]").forEach(function(btn){
      btn.addEventListener("click", function(){
        UI.lang = btn.getAttribute("data-lang");
        localStorage.setItem("woods_lang", UI.lang);
        render();
      });
    });

    var loginForm = document.getElementById("login-form");
    if(loginForm){
      loginForm.addEventListener("submit", function(e){
        e.preventDefault();
        safeRun(async function(){
          UI.busy=true; render();
          var email = usernameToEmail(loginForm.username.value);
          var password = loginForm.password.value;
          var res = await sbClient.auth.signInWithPassword({ email: email, password: password });
          UI.busy=false;
          if(res.error){ UI.authError = t('err_login'); render(); return; }
          UI.authError=""; UI.loading=true; render();
          await refreshAll(); UI.loading=false; UI.view="calendar"; render();
        });
      });
    }
    var goSignup = document.getElementById("go-signup");
    if(goSignup) goSignup.addEventListener("click", function(){ UI.screen="signup"; UI.authError=""; render(); });
    var goLogin = document.getElementById("go-login");
    if(goLogin) goLogin.addEventListener("click", function(){ UI.screen="login"; UI.authError=""; render(); });

    var signupForm = document.getElementById("signup-form");
    if(signupForm){
      signupForm.addEventListener("submit", function(e){
        e.preventDefault();
        safeRun(async function(){
          var fullName = signupForm.fullname.value.trim();
          var realEmail = signupForm.email.value.trim();
          var username = signupForm.username.value.trim();
          var password = signupForm.password.value;
          if(!fullName){ UI.authError=t('err_fullname_required'); render(); return; }
          if(!realEmail || realEmail.indexOf("@")===-1 || realEmail.indexOf(".")===-1){ UI.authError=t('err_email_required'); render(); return; }
          if(username.length<2){ UI.authError=t('err_username_short'); render(); return; }
          UI.busy=true; render();
          var email = usernameToEmail(username);
          var signRes = await sbClient.auth.signUp({ email: email, password: password });
          if(signRes.error){
            UI.busy=false;
            UI.authError = signRes.error.message.indexOf("already")!==-1 ? t('err_username_taken') : signRes.error.message;
            render(); return;
          }
          var newId = signRes.data.user && signRes.data.user.id;
          if(!newId){ UI.busy=false; UI.authError="Check your project's email-confirmation setting."; render(); return; }
          var profRes = await sbClient.from('profiles').insert({ id:newId, username:username, full_name:fullName, email:realEmail }).select().single();
          UI.busy=false;
          if(profRes.error){ UI.authError = profRes.error.message; render(); return; }
          UI.authError=""; UI.loading=true; render();
          await refreshAll(); UI.loading=false; UI.view="calendar"; render();
        });
      });
    }

    var logoutBtn = document.getElementById("logout-btn");
    if(logoutBtn) logoutBtn.addEventListener("click", function(){
      safeRun(async function(){
        await sbClient.auth.signOut();
        CACHE = { me:null, profiles:[], slots:[], bookings:[], slotCounts:{} };
        UI.screen="login"; render();
      });
    });

    var menuToggle = document.getElementById("menu-toggle");
    if(menuToggle) menuToggle.addEventListener("click", function(){ UI.sidebarOpen=!UI.sidebarOpen; render(); });
    var sidebarClose = document.getElementById("sidebar-close");
    if(sidebarClose) sidebarClose.addEventListener("click", function(){ UI.sidebarOpen=false; render(); });
    var sidebarOverlay = document.getElementById("sidebar-overlay");
    if(sidebarOverlay) sidebarOverlay.addEventListener("click", function(){ UI.sidebarOpen=false; render(); });
    var installBtn = document.getElementById("install-app-btn");
    if(installBtn) installBtn.addEventListener("click", handleInstallClick);

    document.querySelectorAll("[data-nav]").forEach(function(btn){
      btn.addEventListener("click", function(){ UI.view=btn.getAttribute("data-nav"); UI.sidebarOpen=false; render(); });
    });
    document.querySelectorAll("[data-cal]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var dir = btn.getAttribute("data-cal")==="next" ? 1 : -1;
        UI.calMonth = new Date(UI.calMonth.getFullYear(), UI.calMonth.getMonth()+dir, 1);
        render();
      });
    });
    document.querySelectorAll(".cal-day[data-date]").forEach(function(cell){
      var d = cell.getAttribute("data-date"); if(!d) return;
      cell.addEventListener("click", function(){ UI.selectedDate=d; render(); });
    });

    document.querySelectorAll("[data-book]").forEach(function(btn){
      btn.addEventListener("click", function(){
        safeRun(async function(){
          var slotId = btn.getAttribute("data-book");
          var res = await sbClient.rpc('book_session', { p_slot_id: slotId });
          if(res.error){ showToast(translateError(res.error.message)); return; }
          await refreshAll(); showToast(t('toast_booked')); render();
        });
      });
    });
    document.querySelectorAll("[data-cancel]").forEach(function(btn){
      btn.addEventListener("click", function(){
        safeRun(async function(){
          var bookingId = btn.getAttribute("data-cancel");
          var res = await sbClient.rpc('cancel_booking', { p_booking_id: bookingId });
          if(res.error){ showToast(translateError(res.error.message)); return; }
          await refreshAll(); showToast(t('toast_cancelled')); render();
        });
      });
    });
    document.querySelectorAll("[data-remove-slot]").forEach(function(btn){
      btn.addEventListener("click", function(){
        safeRun(async function(){
          var slotId = btn.getAttribute("data-remove-slot");
          var bookedCount = bookedCountForSlot(slotId);
          if(bookedCount>0){
            var ok = confirm(t('confirm_remove_slot')(bookedCount));
            if(!ok) return;
          }
          var res = await sbClient.rpc('admin_remove_slot', { p_slot_id: slotId });
          if(res.error){ showToast(translateError(res.error.message)); return; }
          await refreshAll(); render();
        });
      });
    });
    var addSlotForm = document.getElementById("add-slot-form");
    if(addSlotForm){
      addSlotForm.addEventListener("submit", function(e){
        e.preventDefault();
        safeRun(async function(){
          var timeVal = document.getElementById("new-slot-time").value;
          if(!timeVal) return;
          var res = await sbClient.from('slots').insert({ date: UI.selectedDate, time: timeVal });
          if(res.error){ showToast(res.error.message.indexOf("duplicate")!==-1 ? t('toast_slot_taken') : res.error.message); return; }
          await refreshAll(); render();
        });
      });
    }
    document.querySelectorAll("[data-add-tokens]").forEach(function(btn){
      btn.addEventListener("click", function(){
        safeRun(async function(){
          var clientId = btn.getAttribute("data-add-tokens");
          var row = document.querySelector('[data-credit-row="'+clientId+'"]');
          var amount = parseInt(row.querySelector(".amount-input").value,10);
          var expiryDate = row.querySelector(".expiry-input").value;
          if(!amount || amount<1){ showToast(t('toast_enter_amount')); return; }
          var res = await sbClient.rpc('credit_tokens', { p_user_id: clientId, p_amount: amount, p_expires_at: expiryDate || null });
          if(res.error){ showToast(translateError(res.error.message)); return; }
          await refreshAll();
          var c = CACHE.profiles.find(function(p){ return p.id===clientId; });
          showToast(t('toast_added_tokens')(amount, c?(c.full_name||c.username):"")); render();
        });
      });
    });
    document.querySelectorAll("[data-remove-tokens]").forEach(function(btn){
      btn.addEventListener("click", function(){
        safeRun(async function(){
          var clientId = btn.getAttribute("data-remove-tokens");
          var row = document.querySelector('[data-credit-row="'+clientId+'"]');
          var amount = parseInt(row.querySelector(".amount-input").value,10);
          if(!amount || amount<1){ showToast(t('toast_enter_amount')); return; }
          var res = await sbClient.rpc('debit_tokens', { p_user_id: clientId, p_amount: amount });
          if(res.error){ showToast(translateError(res.error.message)); return; }
          await refreshAll();
          var c = CACHE.profiles.find(function(p){ return p.id===clientId; });
          showToast(t('toast_removed_tokens')(amount, c?(c.full_name||c.username):"")); render();
        });
      });
    });
    document.querySelectorAll("[data-set-expiry]").forEach(function(btn){
      btn.addEventListener("click", function(){
        safeRun(async function(){
          var clientId = btn.getAttribute("data-set-expiry");
          var row = document.querySelector('[data-credit-row="'+clientId+'"]');
          var expiryDate = row.querySelector(".expiry-input").value;
          if(!expiryDate){ showToast(t('toast_pick_date')); return; }
          var res = await sbClient.rpc('set_token_expiry', { p_user_id: clientId, p_expires_at: expiryDate });
          if(res.error){ showToast(translateError(res.error.message)); return; }
          await refreshAll();
          var c = CACHE.profiles.find(function(p){ return p.id===clientId; });
          showToast(t('toast_updated_expiry')(c?(c.full_name||c.username):"")); render();
        });
      });
    });
  }

  var deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredInstallPrompt=e; });
  async function handleInstallClick(){
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      try { await deferredInstallPrompt.userChoice; } catch(e){}
      deferredInstallPrompt = null;
      return;
    }
    var ua = navigator.userAgent || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    showToast(isIOS ? t('toast_install_ios') : t('toast_install_other'));
  }

  async function boot(){
    if(!sbClient){ UI.loading=false; render(); return; }
    await refreshAll();
    UI.loading=false;
    render();
    sbClient.auth.onAuthStateChange(function(){});
    setInterval(function(){ if(CACHE.me && !UI.loading) render(); }, 60000);
  }
  boot();
})();
</script>
</body>
</html>
